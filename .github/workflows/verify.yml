name: 驗證開發者範例
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: 安裝沙盒與測試依賴
        run: python -m pip install -r examples/local-sandbox/requirements.txt pytest httpx
      - name: 驗證 API 邊界
        run: python -m pytest examples/local-sandbox/sandbox/test_api.py -q
        env:
          PYTHONPATH: examples/local-sandbox
      - name: 驗證兩種語言的完整 HTTP 流程
        run: python scripts/verify.py
